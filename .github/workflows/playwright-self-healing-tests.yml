name: Playwright Self-Healing Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Cucumber Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HEADLESS: "true"
      AI_HEALING_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Playwright browser
        run: ./gradlew installPlaywrightBrowsers

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-self-healing-reports
          path: |
            build/reports/cucumber/cucumber.html
            build/reports/cucumber/cucumber.json
            build/reports/tests/test
            build/evidence
          if-no-files-found: ignore
